services:

  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: market_system
      POSTGRES_USER: market_app
      POSTGRES_PASSWORD: market_password
    volumes:
      - market-system-db-data:/var/lib/postgresql
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_app -d market_system"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: market_system
      DB_USER: market_app
      DB_PASSWORD: market_password
      MIGRATION_DB_USER: market_app
      MIGRATION_DB_PASSWORD: market_password
      JWT_SECRET: local_jwt_secret
      JWT_REFRESH_SECRET: local_refresh_secret
      PASSWORD_PEPPER: local_password_pepper
    ports:
      - "5000:5000"
    command: ["sh", "-c", "node src/database/migrate.js && npm start"]

volumes:
  market-system-db-data: