name: MMS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: market_system_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      MIGRATION_DB_USER: postgres
      MIGRATION_DB_PASSWORD: postgres

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: market_system_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Set up test database
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d market_system_test \
            -f src/database/schema.sql

      - name: Run database migrations
        run: node src/database/migrate.js

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test